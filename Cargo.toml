[package]
description = "Light client for Starknet"
edition = "2021"
name = "beerus"
version = "0.7.1"
repository = "https://github.com/eigerco/beerus"
license = "MIT"

[features]
default = ["rpc"]
rpc = ["dep:axum"]

[profile.release]
lto = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.82"
eyre = "0.6.12"
tracing = "0.1.40"
tracing-subscriber = "0.3.17"
thiserror = "2.0.17"
axum = { version = "0.8.6", optional = true }
iamgroot = { git = "https://github.com/sergey-melnychuk/iamgroot", tag = "v0.2.8" }
regex = "1.11.1"
once_cell = "1.16.0-pre.1"

starknet-types-core = "0.1.9"
starknet-crypto = "0.8.1"

base64 = "0.22.1"
flate2 = "1.0.28"
hex = "0.4.3"
bitvec = "1.0.1"
validator = { version = "0.20.0", features = ["derive"] }
url = "2.5.1"
toml = "0.9.8"
lru = "0.16.2"
alloy-primitives = { version = "1.4.1", default-features = false }
indexmap = "=2.12.0"
semver = "1.0.27"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt-multi-thread", "time"] }

blockifier = { git = "https://github.com/starkware-libs/sequencer.git", branch = "v0.14.0-rc.3" }
starknet_api = { git = "https://github.com/starkware-libs/sequencer.git", branch = "v0.14.0-rc.3" }
cairo-lang-starknet-classes = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }

reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
ureq = { version = "3.1.2", features = ["json"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
## Tokio WASM support: https://docs.rs/tokio/latest/tokio/#wasm-support
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

blockifier = { git = "https://github.com/starkware-libs/sequencer.git", branch = "v0.14.0-rc.3" }
starknet_api = { git = "https://github.com/starkware-libs/sequencer.git", branch = "v0.14.0-rc.3" }
cairo-lang-starknet-classes = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }

reqwest = { version = "0.12.3", default-features = false, features = ["json"] }

gloo-timers = { version = "0.3.0", features = ["futures"] }
web-sys = "0.3.72"
web-time = "1.1.0"


[dev-dependencies]
wiremock = "0.6.2"

[patch.crates-io]
size-of = { path = "patches/size-of" }
cairo-vm = { git = "https://github.com/lambdaclass/cairo-vm", tag = "v1.0.2" }
cairo-lang-starknet-classes = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-utils = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-casm = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-runner = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra-ap-change = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra-gas = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra-generator = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra-to-casm = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-sierra-type-size = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-starknet = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-compiler = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-defs = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-diagnostics = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-filesystem = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-formatter = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-lowering = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-parser = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-plugins = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-project = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-runnable-utils = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-semantic = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-syntax = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-test-utils = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }
cairo-lang-eq-solver = { git = "https://github.com/starkware-libs/cairo.git", tag = "v2.10.0" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)', 'cfg(tarpaulin_include)'] }
